        - generic [ref=f16e393]:
          - heading "La FAQ assurance deux roues d’APRIL Moto" [level=2] [ref=f16e397]
          - generic [ref=f16e398]:
            - heading "J’ai acheté un véhicule, dois-je l’assurer ?" [level=3] [ref=f16e401]
            - paragraph [ref=f16e402]: Pour couvrir vos motos contre les dommages que vous pourriez subir ou occasionner, vous devez souscrire à un contrat d’assurance. Selon la loi, tout véhicule terrestre à moteur doit être assuré en responsabilité civile. C’est la garantie minimale obligatoire à avoir. Elle permet, lors d’accidents de la circulation, d’indemniser le tiers auquel vous auriez pu occasionner des dommages.
          - generic [ref=f16e403]:
            - heading "Quelle formule choisir pour assurer ma moto ?" [level=3] [ref=f16e406]
            - paragraph [ref=f16e407]: "Il existe différentes formules pour assurer votre deux-roues. Les 3 principaux niveaux de garantie sont l’assurance au tiers (obligatoire), l’assurance vol-incendie et l’assurance tous-risques. La garantie tous-risques est le niveau maximum de couverture proposé par les assureurs. Vous pouvez ensuite ajouter des options : l’option accessoires et équipements (pour couvrir votre casque par exemple), l’assistance panne ou encore l’option rachat de franchise."
          - generic [ref=f16e408]:
            - heading "Suis-je protégé en cas d’accident responsable ?" [level=3] [ref=f16e411]
            - paragraph [ref=f16e412]: En cas d’accident responsable votre contrat d’assurance ne couvre pas les dommages corporels que vous pourriez subir. Aucun motard ne veut y penser, pourtant le risque est réel. C’est pourquoi, il fortement conseillé de souscrire à l’option protection corporelle du conducteur, afin d’être bien protégé.
          - generic [ref=f16e413]:
            - heading "Quel est le prix d’une assurance deux-roues ?" [level=3] [ref=f16e416]
            - paragraph [ref=f16e417]: Que vous souhaitez assurer votre auto ou votre deux-roues, le tarif dépend de nombreux critères. Pour connaître le coût pour assurer votre véhicule, vous pouvez réaliser un devis en ligne en 2 minutes, rien de plus simple ! Vous pouvez aussi contacter nos conseillers qui vous aideront à créer le contrat d’assurance le plus adapté à vos besoins.
